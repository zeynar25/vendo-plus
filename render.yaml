# Render Blueprint for the Vendo+ backend.
# New + > Blueprint > pick this repo > Apply. Render reads this file from the repo root.
services:
  - type: web
    name: vendoplus-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
